# Dịch vụ phụ thuộc cho môi trường phát triển. Chạy: npm run services:up
# Ứng dụng (api, web) chạy trực tiếp trên máy bằng `npm run dev`.
# Cổng phía máy dùng giá trị riêng để tránh trùng dịch vụ khác; đổi qua biến môi trường
# (POSTGRES_PORT, REDIS_PORT, MAILPIT_SMTP_PORT, MAILPIT_UI_PORT, SEAWEEDFS_S3_PORT) hoặc file .env
# ở thư mục gốc.
name: olympia

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: olympia
      POSTGRES_PASSWORD: olympia
      POSTGRES_DB: olympia
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5440}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U olympia -d olympia']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # SFU cho video/voice (dùng từ P6). Chế độ dev: API key `devkey`, secret `secret`.
  # `--node-ip 127.0.0.1`: trình duyệt trên máy dev gửi media tới cổng 7881/7882 đã map ra máy chủ
  # (mặc định LiveKit quảng bá IP nội bộ của container và IP public, trình duyệt không tới được).
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ['--dev', '--bind', '0.0.0.0', '--node-ip', '127.0.0.1']
    ports:
      - '127.0.0.1:7880:7880'
      - '7881:7881'
      - '7882:7882/udp'

  # Bắt mọi email gửi đi khi dev. Giao diện xem thư: http://localhost:8026
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025'

  # Object storage S3-compatible cho media câu hỏi (DL-025). Dev không bật xác thực S3:
  # mọi access key đều được chấp nhận, chỉ nghe trên localhost.
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    command:
      [
        'server',
        '-dir=/data',
        '-ip.bind=0.0.0.0',
        '-master.volumeSizeLimitMB=1024',
        '-volume.max=0',
        '-s3',
        '-s3.port=8333',
      ]
    ports:
      - '127.0.0.1:${SEAWEEDFS_S3_PORT:-8340}:8333'
    volumes:
      - seaweedfs-data:/data

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
